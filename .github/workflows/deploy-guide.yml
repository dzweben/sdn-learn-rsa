name: Deploy LEARN pipeline site

# Publishes the project site to GitHub Pages:
#   /             landing page (site/index.html)
#   /walkthrough  methods walkthrough (guides/pipeline-walkthrough)
#   /report       interactive results report (analysis/new-v2)
# Static assembly only. No build step, no Node.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'guides/pipeline-walkthrough/**'
      - 'analysis/new-v2/**'
      - '.github/workflows/deploy-guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site/walkthrough _site/report
          cp site/index.html _site/index.html
          cp -R guides/pipeline-walkthrough/. _site/walkthrough/
          cp -R analysis/new-v2/. _site/report/
          echo "assembled:"; find _site -maxdepth 2 -type d

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
