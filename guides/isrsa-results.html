<script type="text/babel">

const F = "Calibri,'Segoe UI',Arial,sans-serif";
const CREAM = "#faf8f2";
const NAVY = "#1b1b2e";
const RULE = "#cdc6b0";
const MUTED = "#888";
const IDIO = "#2980b9";
const CONV = "#c0392b";
const IDIO_BG = "#eaf2fd";
const CONV_BG = "#fdeaea";

function Panel({children, title, subtitle}) {
  return (
    <div style={{width:1060, background:CREAM, border:`1.5px solid ${RULE}`, borderRadius:6,
      padding:"28px 36px 32px", marginBottom:28}}>
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:F, fontSize:24, fontWeight:700, color:NAVY}}>{title}</div>
        {subtitle && <div style={{fontFamily:F, fontSize:13, color:MUTED, marginTop:2}}>{subtitle}</div>}
      </div>
      <div style={{borderTop:`2px solid #2d4b8c`, paddingTop:16}}>{children}</div>
    </div>
  );
}

function StatBox({value, label, sub, color}) {
  return (
    <div style={{textAlign:"center", padding:"10px 18px"}}>
      <div style={{fontFamily:F, fontSize:32, fontWeight:700, color:color||"#2d4b8c"}}>{value}</div>
      <div style={{fontFamily:F, fontSize:11, fontWeight:700, color:NAVY, marginTop:2}}>{label}</div>
      {sub && <div style={{fontFamily:F, fontSize:10, color:MUTED, marginTop:1}}>{sub}</div>}
    </div>
  );
}

function RegionCard({brain, name, func, vox, meanRho, meanP, niceRho, niceP, type}) {
  const bg = type === "idio" ? IDIO_BG : CONV_BG;
  const accent = type === "idio" ? IDIO : CONV;
  const border = type === "idio" ? "#a8c8e0" : "#e0b0b0";
  const mSig = meanP < 0.05;
  const nSig = niceP < 0.05;
  return (
    <div style={{display:"flex", background:bg, border:`1px solid ${border}`,
      borderRadius:5, marginBottom:6, overflow:"hidden", height:90}}>
      {/* Brain image */}
      <div style={{flex:"0 0 120px", background:"black", display:"flex", alignItems:"center", justifyContent:"center", padding:2}}>
        {brain && BRAIN[brain] ? (
          <img src={BRAIN[brain]} style={{height:"100%", objectFit:"contain", borderRadius:3}} alt={name}/>
        ) : (
          <div style={{color:"#555", fontFamily:F, fontSize:10}}>—</div>
        )}
      </div>
      {/* Region name + function */}
      <div style={{flex:"0 0 240px", padding:"10px 14px", display:"flex", flexDirection:"column", justifyContent:"center",
        borderRight:`1px solid ${border}`}}>
        <div style={{fontFamily:F, fontSize:14, fontWeight:700, color:NAVY, lineHeight:1.2}}>{name}</div>
        <div style={{fontFamily:F, fontSize:10.5, color:MUTED, marginTop:4, lineHeight:1.4}}>{func}</div>
      </div>
      {/* Stats */}
      <div style={{flex:"0 0 280px", padding:"8px 16px", display:"flex", alignItems:"center", gap:16,
        borderRight:`1px solid ${border}`}}>
        {/* Voxels */}
        <div style={{textAlign:"center", flex:"0 0 50px"}}>
          <div style={{fontFamily:F, fontSize:18, fontWeight:700, color:accent}}>{vox}</div>
          <div style={{fontFamily:F, fontSize:9, color:MUTED}}>voxels</div>
        </div>
        {/* Mean */}
        <div style={{textAlign:"center", flex:"0 0 85px", background:mSig ? "rgba(0,0,0,.04)" : "none",
          borderRadius:4, padding:"4px 6px"}}>
          <div style={{fontFamily:F, fontSize:9, fontWeight:700, color:mSig ? NAVY : MUTED}}>MEAN</div>
          <div style={{fontFamily:F, fontSize:16, fontWeight:700, color:mSig ? accent : MUTED}}>
            {meanRho > 0 ? "+" : ""}{meanRho.toFixed(2)}
          </div>
          <div style={{fontFamily:F, fontSize:9, color:mSig ? accent : MUTED, fontWeight:mSig?700:400}}>
            {meanP < 0.001 ? "p < .001" : `p = .${String(meanP).split('.')[1]?.slice(0,3)||'000'}`}
            {mSig ? " *" : ""}
          </div>
        </div>
        {/* Nice */}
        <div style={{textAlign:"center", flex:"0 0 85px", background:nSig ? "rgba(0,0,0,.04)" : "none",
          borderRadius:4, padding:"4px 6px"}}>
          <div style={{fontFamily:F, fontSize:9, fontWeight:700, color:nSig ? NAVY : MUTED}}>NICE</div>
          <div style={{fontFamily:F, fontSize:16, fontWeight:700, color:nSig ? accent : MUTED}}>
            {niceRho > 0 ? "+" : ""}{niceRho.toFixed(2)}
          </div>
          <div style={{fontFamily:F, fontSize:9, color:nSig ? accent : MUTED, fontWeight:nSig?700:400}}>
            {niceP < 0.001 ? "p < .001" : `p = .${String(niceP).split('.')[1]?.slice(0,3)||'000'}`}
            {nSig ? " *" : ""}
          </div>
        </div>
      </div>
      {/* Direction indicator */}
      <div style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"8px 12px"}}>
        {mSig && nSig ? (
          <div style={{fontFamily:F, fontSize:11, fontWeight:700, color:"#5c3b8a", textAlign:"center"}}>
            Sig in<br/>both
          </div>
        ) : mSig && !nSig && Math.sign(meanRho) === Math.sign(niceRho) ? (
          <div style={{fontFamily:F, fontSize:10, color:MUTED, textAlign:"center"}}>
            Same dir.,<br/>Mean stronger
          </div>
        ) : nSig && !mSig && Math.sign(meanRho) === Math.sign(niceRho) ? (
          <div style={{fontFamily:F, fontSize:10, color:MUTED, textAlign:"center"}}>
            Same dir.,<br/>Nice stronger
          </div>
        ) : (
          <div style={{fontFamily:F, fontSize:10, color:MUTED, textAlign:"center"}}>—</div>
        )}
      </div>
    </div>
  );
}
