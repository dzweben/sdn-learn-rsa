function Panel({children,idx,total,title,subtitle}){

// ─── STAT BOX ────────────────────────────────────────────────────────────────
function StatBox({value, label, sublabel, color}){
  return(
    <div style={{textAlign:"center",padding:"12px 20px"}}>
      <div style={{fontFamily:T.d,fontSize:36,fontWeight:700,color:color||T.accent,letterSpacing:"-0.02em"}}>{value}</div>
      <div style={{fontFamily:T.d,fontSize:11,fontWeight:600,color:T.navy,marginTop:2}}>{label}</div>
      {sublabel && <div style={{fontFamily:T.g,fontSize:10,color:T.muted,fontStyle:"italic",marginTop:2}}>{sublabel}</div>}
    </div>
  );
}

// ─── RHO BAR ─────────────────────────────────────────────────────────────────
function RhoBar({mean_rho, nice_rho, mean_p, nice_p, maxAbs=0.4, width=200, height=32}){
  const mid = width/2;
  const scale = (v) => (v / maxAbs) * mid;
  const meanW = Math.abs(scale(mean_rho));
  const niceW = Math.abs(scale(nice_rho));
  const meanSig = mean_p < 0.05;
  const niceSig = nice_p < 0.05;
  const meanColor = mean_rho < 0 ? (meanSig ? T.idio : "#dba8a8") : (meanSig ? T.conv : "#a8c8e8");
  const niceColor = nice_rho < 0 ? (niceSig ? "#d35400" : "#e8c0a0") : (niceSig ? "#27ae60" : "#a8d8b8");

  return(
    <svg width={width} height={height} style={{display:"block"}}>
      <line x1={mid} y1={0} x2={mid} y2={height} stroke={T.rule} strokeWidth={1}/>
      <rect x={mean_rho < 0 ? mid - meanW : mid} y={3}
        width={meanW} height={11} rx={2} fill={meanColor}/>
      <rect x={nice_rho < 0 ? mid - niceW : mid} y={18}
        width={niceW} height={11} rx={2} fill={niceColor}/>
      <text x={3} y={12} fontSize={8} fontFamily={T.d} fontWeight={600} fill={T.muted}>Mean</text>
      <text x={3} y={27} fontSize={8} fontFamily={T.d} fontWeight={600} fill={T.muted}>Nice</text>
      {meanSig && <text x={mean_rho<0 ? mid-meanW-10 : mid+meanW+3} y={12} fontSize={9} fontFamily={T.d} fontWeight={700} fill={meanColor}>*</text>}
      {niceSig && <text x={nice_rho<0 ? mid-niceW-10 : mid+niceW+3} y={27} fontSize={9} fontFamily={T.d} fontWeight={700} fill={niceColor}>*</text>}
    </svg>
  );
}

// ─── REGION CARD ─────────────────────────────────────────────────────────────
function RegionCard({r, type, brainKey}){
  const border = type==="idio" ? "#e0b0b0" : "#a8c8e0";
  const bg = type==="idio" ? T.idioLight : T.convLight;
  const condColor = r.condition==="Both" ? T.purple : r.condition==="Mean" ? T.idio : T.conv;
  return(
    <div style={{display:"flex",background:bg,border:`1px solid ${border}`,
      borderRadius:6,marginBottom:8,overflow:"hidden"}}>
      {/* Brain image */}
      {brainKey && BRAIN[brainKey] && (
        <div style={{flex:"0 0 220px",background:"black",display:"flex",alignItems:"center",padding:4}}>
          <img src={BRAIN[brainKey]} style={{width:"100%",borderRadius:3}} alt={r.region}/>
        </div>
      )}
      {/* Region info */}
      <div style={{flex:"0 0 220px",padding:"10px 14px",borderRight:`1px solid ${border}`}}>
        <div style={{fontFamily:T.d,fontSize:12.5,fontWeight:700,color:T.navy,lineHeight:1.3}}>{r.region}</div>
        <div style={{fontFamily:T.d,fontSize:9,color:T.muted,marginTop:3}}>
          {r.network} &middot; {r.hemi} &middot; MNI {r.mni}
        </div>
        <div style={{marginTop:4}}>
          <Tag color={condColor}>{r.condition}</Tag>
          <span style={{fontFamily:T.d,fontSize:9,color:T.muted}}>{r.vox} vox</span>
        </div>
      </div>
      {/* Bar chart */}
      <div style={{flex:"0 0 220px",padding:"8px 12px",display:"flex",alignItems:"center",
        borderRight:`1px solid ${border}`}}>
        <RhoBar mean_rho={r.mean_rho} nice_rho={r.nice_rho} mean_p={r.mean_p} nice_p={r.nice_p}/>
      </div>
      {/* Note */}
      <div style={{flex:1,padding:"10px 14px",display:"flex",alignItems:"center"}}>
        <div style={{fontFamily:T.g,fontSize:11.5,color:T.navy,lineHeight:1.5,fontStyle:"italic"}}>{r.note}</div>
      </div>
    </div>
  );
}
